<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
  封面卡模板。两种风格随机：memo（备忘录风）/ macaron（马卡龙大字报风）。
  数据来源：同目录 ./data/cover.json（标题钩子等文案，由模型按文章生成）。
  用法：cover.html?card=memo|macaron&bg=<淡色名>  渲染 1080x1440。

  设计铁律（见 references/visual-standards.md）：
  · 封面只放两样东西——标题文字 + 右上角引流 handle（@IT杨秀才）。
  · 不放表情/emoji 图标、不放副标题、不放卖点、不放左下角品牌。
  · 标题整体垂直居中。
  · 字号按字数「双向自适应」：字少放大填满版面，字多缩小容纳全文。
  淡背景池见下方 BG。
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#888; }
  ::-webkit-scrollbar{ display:none; }
  body{ font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  .card{ width:1080px; height:1440px; position:relative; overflow:hidden; display:none; }
  body[data-card="memo"] #memo{ display:flex; }
  body[data-card="macaron"] #macaron{ display:flex; }

  /* 备忘录风（淡色纸 + 横线）：topbar 顶部 / 标题区垂直居中 / foot 底部 */
  #memo{ flex-direction:column; background:var(--paper,#fbfbf7);
    background-image:repeating-linear-gradient(var(--paper,#fbfbf7), var(--paper,#fbfbf7) 71px, rgba(0,0,0,.05) 72px); }
  #memo .topbar{ height:108px; display:flex; align-items:center; justify-content:space-between; padding:0 56px; flex:none; }
  #memo .topbar .back{ color:#f2b705; font-size:34px; font-weight:600; }
  #memo .topbar .m-author{ color:#9a9a93; font-size:30px; font-weight:700; }
  #memo .wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 84px 130px; }
  #memo .kicker{ font-size:30px; color:#9a9a93; font-weight:600; letter-spacing:2px; margin-bottom:48px; }
  #memo h1{ font-size:104px; line-height:1.34; font-weight:800; color:#33332f; letter-spacing:1px; }
  #memo .hl{ background:linear-gradient(transparent 8%, #ffe14d 8% 86%, transparent 86%); padding:0 6px; border-radius:2px; }
  #memo .en{ font-family:"SF Pro Display","PingFang SC",sans-serif; }
  #memo .foot{ position:absolute; left:84px; bottom:96px; right:84px; display:flex; align-items:center;
        justify-content:flex-end; font-size:32px; color:#8a8a82; font-weight:600; }
  #memo .foot .tag{ background:#33332f; color:#fbfbf7; padding:10px 26px; border-radius:40px; font-size:28px; }

  /* 马卡龙大字报风（淡色底 + 撞色高亮）：标题整体垂直居中 */
  #macaron{ flex-direction:column; justify-content:center; background:var(--bg,#dff0fb); padding:96px 84px; }
  #macaron .quote{ font-size:170px; line-height:.5; color:rgba(0,0,0,.10); font-weight:800; font-family:Georgia,serif; margin-bottom:8px; }
  #macaron .author{ position:absolute; top:70px; right:84px; font-size:30px; color:#51606e; font-weight:700; }
  #macaron h1{ font-size:112px; line-height:1.32; font-weight:900; color:#1f2d3a; letter-spacing:1px; }
  #macaron .hl-g{ background:#bdf0c4; padding:0 10px; border-radius:6px; }
  #macaron .hl-y{ background:#ffe14d; padding:0 10px; border-radius:6px; }
  #macaron .hl-o{ background:#ffd0a6; padding:0 10px; border-radius:6px; }
</style>
</head>
<body data-card="memo">
  <div class="card" id="memo">
    <div class="topbar"><div class="back">‹ 备忘录</div><div class="m-author" id="m-author"></div></div>
    <div class="wrap">
      <div class="kicker" id="m-kicker"></div>
      <h1 id="m-title"></h1>
    </div>
    <div class="foot"><span class="tag" id="m-tag"></span></div>
  </div>

  <div class="card" id="macaron">
    <div class="author" id="c-author"></div>
    <div class="quote">&#8220;</div>
    <h1 id="c-title"></h1>
  </div>

<script>
  const BG = { cream:'#faf6ee', blue:'#e1eefb', pink:'#fbe7ef', purple:'#ece6fb',
               green:'#e6f4ea', yellow:'#fcf2d6', mint:'#e2f3f0', sky:'#dfeffb' };
  (async () => {
    const D = await (await fetch('./data/cover.json', {cache:'no-store'})).json();
    const p = new URLSearchParams(location.search);
    const card = p.get('card') || 'memo';
    const bg = p.get('bg');
    document.body.dataset.card = card;
    // 备忘录
    document.getElementById('m-kicker').innerHTML = D.kicker || '';
    document.getElementById('m-title').innerHTML  = D.memo.titleHTML || '';
    document.getElementById('m-author').textContent= '@' + (D.brand || '');
    document.getElementById('m-tag').textContent   = D.memo.tag || '';
    // 马卡龙
    document.getElementById('c-author').textContent= D.macaron.author || ('@'+(D.brand||''));
    document.getElementById('c-title').innerHTML   = D.macaron.titleHTML || '';
    if (bg && BG[bg]) {
      if (card === 'memo') document.documentElement.style.setProperty('--paper', BG[bg]);
      else document.documentElement.style.setProperty('--bg', BG[bg]);
    }
    // 标题字号双向自适应：原标题不改写。
    // 先尝试放大到填满版面（解决字少时标题偏小），再在超界时回退缩小（容纳长标题）。
    function fitTitle(sel, base, min, max, maxH) {
      const el = document.querySelector(sel);
      if (!el) return;
      let f = base; el.style.fontSize = f + 'px'; el.style.lineHeight = '1.3';
      const fits=()=>el.scrollHeight<=maxH&&el.scrollWidth<=el.clientWidth;
      while (fits() && f < max) { f += 4; el.style.fontSize = f + 'px'; }
      while (!fits() && f > min) { f -= 4; el.style.fontSize = f + 'px'; }
    }
    if (card === 'memo') fitTitle('#m-title', 104, 40, 150, 760);
    else fitTitle('#c-title', 112, 40, 158, 820);
    window.__READY__ = true;
  })();
</script>
</body>
</html>
